version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 5
    ignore:
      # Ignora major versions per evitare breaking changes automatici
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
