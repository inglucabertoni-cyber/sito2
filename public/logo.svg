<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="520" height="110">
  <!-- House icon: left half navy, right half amber -->
  <polygon points="50,4 12,40 12,92 50,92" fill="#1E3A5F"/>
  <polygon points="50,4 88,40 88,92 50,92" fill="#F59E0B"/>
  <!-- Thin white divider at center -->
  <line x1="50" y1="4" x2="50" y2="92" stroke="white" stroke-width="1.5"/>
  <!-- B on navy -->
  <text x="14" y="80" font-family="Georgia,serif" font-weight="bold" font-size="38" fill="#F59E0B">B</text>
  <!-- R on amber -->
  <text x="51" y="80" font-family="Georgia,serif" font-weight="bold" font-size="38" fill="#1E3A5F">R</text>
  <!-- Wordmark -->
  <text x="108" y="38" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="22" fill="#1E3A5F" letter-spacing="2">BERTONI ROCCARO</text>
  <text x="109" y="59" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6B7280" letter-spacing="4">INGEGNERI GESTIONALI</text>
  <text x="109" y="78" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#9CA3AF" letter-spacing="1.5">Consulenza immobiliare di precisione</text>
  <!-- Gold accent line -->
  <rect x="109" y="85" width="370" height="2.5" rx="1.25" fill="#F59E0B"/>
</svg>
